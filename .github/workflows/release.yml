name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag version (e.g. v1.0.0). If empty, uses app versionName.'
        required: false
        default: ''
      draft:
        description: 'Create as Draft release'
        required: false
        type: boolean
        default: 'false'
      prerelease:
        description: 'Create as Pre-release'
        required: false
        type: boolean
        default: 'false'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag and version
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(grep -oE '\?: "[0-9]+\.[0-9]+\.[0-9]+"' app/build.gradle.kts | head -n1 | tr -d '?: " ' || echo "0.1.0")
            TAG="v${VERSION:-0.1.0}"
          fi
          CLEAN="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$CLEAN" >> "$GITHUB_OUTPUT"
          echo "Resolved TAG=$TAG VERSION=$CLEAN"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore release keystore
        if: ${{ secrets.ESTEH_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p app/keystore
          echo "${{ secrets.ESTEH_KEYSTORE_BASE64 }}" | base64 -d > app/keystore/release.jks

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest -PversionName="${{ steps.vars.outputs.version }}" --no-daemon

      - name: Build release APK
        env:
          ESTEH_SIGNING_PASSWORD: ${{ secrets.ESTEH_SIGNING_PASSWORD }}
        run: ./gradlew assembleRelease -PversionName="${{ steps.vars.outputs.version }}" --no-daemon

      - name: Package assets
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          mkdir -p release-assets
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          cp "$APK" "release-assets/esteh-mobile-${TAG}.apk"
          (cd release-assets && sha256sum *.apk > checksums.txt)
          ls -la release-assets/

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          FLAGS=()
          if [ "${{ github.event.inputs.draft || 'false' }}" = "true" ]; then FLAGS+=(--draft); fi
          if [ "${{ github.event.inputs.prerelease || 'false' }}" = "true" ]; then FLAGS+=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "Es Teh Evren $TAG" --generate-notes "${FLAGS[@]}"
          fi
