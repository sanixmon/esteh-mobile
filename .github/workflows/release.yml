name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag version (e.g. v1.0.0). If empty, uses app versionName.'
        required: false
        default: ''
      draft:
        description: 'Create as Draft release'
        required: false
        type: boolean
        default: 'false'
      prerelease:
        description: 'Create as Pre-release'
        required: false
        type: boolean
        default: 'false'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine tag and version
        id: vars
        env:
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          INPUT_DRAFT: ${{ github.event.inputs.draft }}
          INPUT_PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(grep -oE '\?: "[0-9]+\.[0-9]+\.[0-9]+"' app/build.gradle.kts | head -n1 | tr -d '?: " ' || echo "0.1.0")
            TAG="v${VERSION:-0.1.0}"
          fi
          CLEAN="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$CLEAN" >> "$GITHUB_OUTPUT"
          echo "draft=$INPUT_DRAFT" >> "$GITHUB_OUTPUT"
          echo "prerelease=$INPUT_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Resolved TAG=$TAG VERSION=$CLEAN"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore release keystore
        env:
          ESTEH_KEYSTORE_BASE64: ${{ secrets.ESTEH_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ESTEH_KEYSTORE_BASE64" ]; then
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              echo "ESTEH_KEYSTORE_BASE64 secret belum diset; build tag dibatalkan agar tidak rilis APK debug-signed." >&2
              exit 1
            fi
            echo "No ESTEH_KEYSTORE_BASE64 secret; skipping keystore restore (non-tag build)."
            exit 0
          fi
          mkdir -p app/keystore
          echo "$ESTEH_KEYSTORE_BASE64" | base64 -d > app/keystore/release.jks

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest -PversionName="${{ steps.vars.outputs.version }}" --no-daemon

      - name: Build release APK
        env:
          ESTEH_SIGNING_PASSWORD: ${{ secrets.ESTEH_SIGNING_PASSWORD }}
        run: ./gradlew assembleRelease -PversionName="${{ steps.vars.outputs.version }}" --no-daemon

      - name: Package assets
        env:
          RELEASE_TAG: ${{ steps.vars.outputs.tag }}
        run: |
          mkdir -p release-assets
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          cp "$APK" "release-assets/esteh-mobile-${RELEASE_TAG}.apk"
          (cd release-assets && sha256sum *.apk > checksums.txt)
          ls -la release-assets/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.vars.outputs.tag }}
          INPUT_DRAFT: ${{ steps.vars.outputs.draft }}
          INPUT_PRERELEASE: ${{ steps.vars.outputs.prerelease }}
        run: |
          FLAGS=()
          if [ "$INPUT_DRAFT" = "true" ]; then FLAGS+=(--draft); fi
          if [ "$INPUT_PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --title "Es Teh Evren $RELEASE_TAG" --generate-notes "${FLAGS[@]}"
          fi
